name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (Windows / Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run PyTest
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python -m pytest --junitxml=test-results.xml
        $xml = [xml](Get-Content test-results.xml)
        $failures = [int]$xml.testsuites.testsuite.failures
        $errors = [int]$xml.testsuites.testsuite.errors
        Write-Host "Total Tests: $($xml.testsuites.testsuite.tests) | Failures: $failures | Errors: $errors"
        if ($failures -gt 0 -or $errors -gt 0) {
          exit 1
        }
